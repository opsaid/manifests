apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argo-events

configMapGenerator:
- name: argo-events-controller-config
  files:
  - controller-config.yaml=configuration/configmaps/controller-config.yaml
  options:
    disableNameSuffixHash: true

replicas:
- name: controller-manager
  count: 1

resources:
- clusters/crds/crds.yaml
- security/serviceaccounts/argo-events-sa.yaml
- security/clusterroles/argo-events-aggregate-to-admin.yaml
- security/clusterroles/argo-events-aggregate-to-edit.yaml
- security/clusterroles/argo-events-aggregate-to-view.yaml
- security/clusterroles/argo-events-role.yaml
- security/clusterrolebindings/argo-events-binding.yaml
- clusters/namespaces/argo-events.yaml
- security/serviceaccounts/argo-events-webhook-sa.yaml
- security/clusterroles/argo-events-webhook.yaml
- security/clusterrolebindings/argo-events-webhook-binding.yaml
- network/services/events-webhook.yaml
- workloads/deployments/controller-manager.yaml
- workloads/deployments/events-webhook.yaml

images:
# 镜像保持官方地址；私有 registry 替换由私有 overlay 的 images newName 完成
- name: quay.io/argoproj/argo-events
  newTag: v1.9.0
