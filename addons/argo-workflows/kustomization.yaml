apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argo

configMapGenerator:
- name: workflow-controller-configmap
  options:
    disableNameSuffixHash: true

#replicas:
#- name: controller-manager
#  count: 1

resources:
- clusters/crds/crds.yaml
- security/serviceaccounts/argo.yaml
- security/serviceaccounts/argo-server.yaml
- security/roles/argo-role.yaml
- security/clusterroles/argo-aggregate-to-admin.yaml
- security/clusterroles/argo-aggregate-to-edit.yaml
- security/clusterroles/argo-aggregate-to-view.yaml
- security/clusterroles/argo-cluster-role.yaml
- security/clusterroles/argo-server-cluster-role.yaml
- security/rolebindings/argo-binding.yaml
- security/clusterrolebindings/argo-binding.yaml
- security/clusterrolebindings/argo-server-binding.yaml
- clusters/namespaces/argo.yaml
- clusters/priority-classes/workflow-controller.yaml
- network/services/argo-server.yaml
- network/ingresses/workflows.yaml
- workloads/deployments/argo-server.yaml
- workloads/deployments/workflow-controller.yaml

# Ingress 实际域名由私有 overlay 替换（network/ingresses/ 清单为 workflows.example.com 占位）；
# 镜像保持官方地址，私有 registry 替换由私有 overlay 的 images newName 完成
images:
- name: quay.io/argoproj/argocli
  newTag: v3.5.7
- name: quay.io/argoproj/workflow-controller
  newTag: v3.5.7
