apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argo

configMapGenerator:
- name: workflow-controller-configmap
#  files:
#  - controller-config.yaml=config/configmap/controller-config.yaml
  options:
    disableNameSuffixHash: true

#replicas:
#- name: controller-manager
#  count: 1

resources:
- cluster/crds.yaml
- cluster/roles.yaml
- cluster/namespace.yaml
- service/services.yaml
- service/ingresses.yaml
- workloads/deployments/argo-server.yaml
- workloads/deployments/workflow-controller.yaml

# Ingress 实际域名由私有 overlay 替换（service/ 清单为 workflows.example.com 占位）；
# 镜像保持官方地址，私有 registry 替换由私有 overlay 的 images newName 完成
images:
- name: quay.io/argoproj/argocli
  newTag: v3.5.7
- name: quay.io/argoproj/workflow-controller
  newTag: v3.5.7
