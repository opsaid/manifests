---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oneops-demo-v1
  namespace: biz-dev-uptime
spec:
  ingressClassName: cilium
  rules:
  - host: open-webui.example.com
    http:
      paths:
      - backend:
          service:
            name: oneops-demo-v1
            port:
              number: 80
        path: /
        pathType: Prefix
