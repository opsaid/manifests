---
apiVersion: v1
kind: Namespace
metadata:
  name: biz-dev-uptime

---
apiVersion: v1
kind: LimitRange
metadata:
  name: limit-range
  namespace: biz-dev-uptime
spec:
  limits:
  - default:
      cpu: 1
      memory: 1Gi
    defaultRequest:
      cpu: 200m
      memory: 256Mi
    type: Container

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: memory-quota
  namespace: biz-dev-uptime
spec:
  hard:
    requests.memory: 10Gi
    limits.memory: 10Gi
