apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: appname

labels:
- includeSelectors: false
  includeTemplates: true
  pairs:
    opsaid.net/appname: appname

configMapGenerator:
- name: appname
  files:
  - app.yaml=configuration/configmaps/app.yaml
  options:
    disableNameSuffixHash: true

replicas:
- name: appname
  count: 1

resources:
- clusters/namespaces/appname.yaml
- network/services/appname.yaml
- workloads/deployments/appname.yaml
# Optional resources: enable deliberately and document ownership/inputs.
# - network/ingresses/appname.yaml
# - clusters/namespaces/limit-range.yaml
# - clusters/namespaces/memory-quota.yaml

images:
# Scaffold placeholder; replace with the official application image when creating an addon.
- name: registry.example.com/appname
  newTag: 0.1.0
