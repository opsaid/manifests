apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: appname

labels:
- includeSelectors: false
  includeTemplates: true
  pairs:
    opsaid.net/appname: demo-v1

configMapGenerator:
- name: demo-v1
  files:
  - app.yaml=configuration/configmaps/app.yaml
  options:
    disableNameSuffixHash: true

replicas:
- name: demo-v1
  count: 1

resources:
- network/services/app.yaml
- network/ingresses/app.yaml
- workloads/deployments/demo-v1.yaml

images:
- name: registry.example.com/appname/demo
  newTag: 0.1.0
