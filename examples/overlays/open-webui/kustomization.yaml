apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 公开示例测试当前代码；复制到私有仓库后改为公共 Git URL + 固定发布 tag/SHA。
# namespace 与镜像 tag 均继承 base，generator options（稳定名）也随 merge 继承；只写差异。
resources:
- ../../../addons/open-webui

configMapGenerator:
- name: open-webui
  behavior: merge
  envs:
  - configuration/configmaps/open-webui.env

secretGenerator:
- name: open-webui
  behavior: merge
  envs:
  - configuration/secrets/open-webui.env

images:
# 组织公共镜像仓库（公开标识，不属于私密值）；仅写 newName，tag 继承 base 固定版本。
- name: ghcr.io/open-webui/open-webui
  newName: registry.cn-hangzhou.aliyuncs.com/opsaid/open-webui
- name: redis
  newName: registry.cn-hangzhou.aliyuncs.com/opsaid/redis

patches:
- target:
    group: networking.k8s.io
    version: v1
    kind: Ingress
    name: open-webui
  patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: open-webui.apps.example.com
    - op: add
      path: /spec/ingressClassName
      value: nginx
    - op: add
      path: /spec/tls
      value:
      - hosts:
        - open-webui.apps.example.com
        secretName: open-webui-tls
# 资源 patch 按容器名合并，不依赖 containers 数组顺序；requests/limits 内逐键合并：
# 主容器写全 requests/limits 全量生效；redis 只写 requests，limits 继承 base 值。
- target:
    group: apps
    version: v1
    kind: Deployment
    name: open-webui
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: open-webui
    spec:
      template:
        spec:
          containers:
          - name: open-webui
            resources:
              requests:
                cpu: "1"
                memory: 2Gi
              limits:
                cpu: "2"
                memory: 4Gi
- target:
    group: apps
    version: v1
    kind: Deployment
    name: open-webui-redis
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: open-webui-redis
    spec:
      template:
        spec:
          containers:
          - name: open-webui-redis
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
