apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 公开示例测试当前代码；复制到私有仓库后改为公共 Git URL + 固定发布 tag/SHA。
# namespace 显式设置：overlay 本地生成的资源（如下方 TLS Secret）靠它落到正确 namespace。
# 镜像 tag 与 generator options（稳定名）继承 base，只写差异。
namespace: open-webui

resources:
- ../../../addons/open-webui

configMapGenerator:
- name: open-webui
  behavior: merge
  envs:
  - configuration/configmaps/open-webui.env

secretGenerator:
- name: open-webui
  behavior: merge
  envs:
  - configuration/secrets/open-webui.env

# TLS 证书示例（默认不开启）：取消注释并把证书文件放到 configuration/secrets/tls/ 下，
# open-webui-tls 即改由本清单管理；与平台预置的同名 Secret 不得并存（管理来源必须唯一）。
# secretGenerator:
# - name: open-webui-tls
#   files:
#   - tls.crt=configuration/secrets/tls/tls.crt
#   - tls.key=configuration/secrets/tls/tls.key
#   type: kubernetes.io/tls
#   options:
#     disableNameSuffixHash: true

images:
# 组织公共镜像仓库（公开标识，不属于私密值）；仅写 newName，tag 继承 base 固定版本。
- name: ghcr.io/open-webui/open-webui
  newName: registry.cn-hangzhou.aliyuncs.com/opsaid/open-webui
- name: redis
  newName: registry.cn-hangzhou.aliyuncs.com/opsaid/redis

patches:
- target:
    group: networking.k8s.io
    version: v1
    kind: Ingress
    name: open-webui
  patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: open-webui.apps.example.com
    - op: add
      path: /spec/ingressClassName
      value: nginx
    - op: add
      path: /spec/tls
      value:
      - hosts:
        - open-webui.apps.example.com
        secretName: open-webui-tls
# 资源 patch 按容器名合并，不依赖 containers 数组顺序；requests/limits 内逐键合并：
# 主容器写全 requests/limits 全量生效；redis 只写 requests，limits 继承 base 值。
- target:
    group: apps
    version: v1
    kind: Deployment
    name: open-webui
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: open-webui
    spec:
      template:
        spec:
          containers:
          - name: open-webui
            resources:
              requests:
                cpu: "1"
                memory: 2Gi
              limits:
                cpu: "2"
                memory: 4Gi
- target:
    group: apps
    version: v1
    kind: Deployment
    name: redis
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: redis
    spec:
      template:
        spec:
          containers:
          - name: redis
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
